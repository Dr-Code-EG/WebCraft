name: webcraft
description: "WebCraft - Sketchware-style visual website builder for Android with drag-and-drop and dialog-based property editing."
publish_to: 'none'

version: 0.8.0+8

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.19.0

  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0

  archive: ^3.6.1
  share_plus: ^10.1.2
  file_picker: ^8.1.4
  image_picker: ^1.1.2

  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 29
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/
