<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WebCraft Blocks</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #blocklyDiv { height: 100%; width: 100%; }
    #toolbox { display: none; }
  </style>
  <script src="blockly_compressed.js"></script>
  <script src="blocks_compressed.js"></script>
  <script src="javascript_compressed.js"></script>
  <script src="msg_en.js"></script>
  <script src="custom_blocks.js"></script>
</head>
<body>
  <div id="blocklyDiv"></div>
  <xml id="toolbox" style="display:none">
    <category name="Logic" colour="210">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
      <block type="logic_null"></block>
      <block type="logic_ternary"></block>
    </category>
    <category name="Loops" colour="120">
      <block type="controls_repeat_ext">
        <value name="TIMES"><shadow type="math_number"><field name="NUM">10</field></shadow></value>
      </block>
      <block type="controls_whileUntil"></block>
      <block type="controls_for">
        <value name="FROM"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
        <value name="TO"><shadow type="math_number"><field name="NUM">10</field></shadow></value>
        <value name="BY"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
      </block>
      <block type="controls_forEach"></block>
      <block type="controls_flow_statements"></block>
    </category>
    <category name="Math" colour="230">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
      <block type="math_single"></block>
      <block type="math_round"></block>
      <block type="math_modulo"></block>
      <block type="math_random_int">
        <value name="FROM"><shadow type="math_number"><field name="NUM">1</field></shadow></value>
        <value name="TO"><shadow type="math_number"><field name="NUM">100</field></shadow></value>
      </block>
    </category>
    <category name="Text" colour="160">
      <block type="text"></block>
      <block type="text_join"></block>
      <block type="text_length"></block>
      <block type="text_isEmpty"></block>
      <block type="text_changeCase"></block>
      <block type="text_trim"></block>
    </category>
    <category name="Lists" colour="260">
      <block type="lists_create_empty"></block>
      <block type="lists_create_with"></block>
      <block type="lists_length"></block>
      <block type="lists_getIndex"></block>
      <block type="lists_setIndex"></block>
    </category>
    <category name="Variables" colour="330" custom="VARIABLE"></category>
    <category name="Functions" colour="290" custom="PROCEDURE"></category>
    <sep></sep>
    <category name="DOM" colour="20">
      <block type="dom_get_value"></block>
      <block type="dom_set_text"></block>
      <block type="dom_set_html"></block>
      <block type="dom_set_style"></block>
      <block type="dom_add_class"></block>
      <block type="dom_remove_class"></block>
      <block type="dom_show"></block>
      <block type="dom_hide"></block>
      <block type="dom_toggle"></block>
    </category>
    <category name="Browser" colour="65">
      <block type="browser_alert"></block>
      <block type="browser_console_log"></block>
      <block type="browser_navigate"></block>
      <block type="browser_reload"></block>
      <block type="browser_storage_set"></block>
      <block type="browser_storage_get"></block>
    </category>
    <category name="HTTP" colour="290">
      <block type="http_fetch"></block>
      <block type="http_post"></block>
    </category>
    <category name="Event" colour="350">
      <block type="event_target"></block>
      <block type="event_prevent_default"></block>
    </category>
  </xml>

  <script>
    let workspace = null;

    function postToHost(channel, payload) {
      try {
        if (window.WebCraftHost && window.WebCraftHost.postMessage) {
          window.WebCraftHost.postMessage(JSON.stringify({ channel: channel, payload: payload }));
        }
      } catch (e) {
        console.error('postToHost failed', e);
      }
    }

    function initWorkspace() {
      const toolbox = document.getElementById('toolbox');
      workspace = Blockly.inject('blocklyDiv', {
        toolbox: toolbox,
        trashcan: true,
        zoom: { controls: true, wheel: false, startScale: 0.9, maxScale: 2, minScale: 0.4 },
        grid: { spacing: 20, length: 2, colour: '#eee', snap: true },
        sounds: false,
        renderer: 'zelos'
      });
      workspace.addChangeListener(onChange);
    }

    function onChange(event) {
      if (event.isUiEvent) return;
      try {
        const xml = Blockly.Xml.workspaceToDom(workspace);
        const xmlText = Blockly.Xml.domToText(xml);
        const code = Blockly.JavaScript.workspaceToCode(workspace);
        postToHost('change', { xml: xmlText, code: code });
      } catch (e) {
        console.error(e);
      }
    }

    function loadXml(xmlText) {
      if (!workspace) return;
      workspace.clear();
      if (!xmlText || xmlText.trim() === '') return;
      try {
        const xml = Blockly.utils.xml.textToDom(xmlText);
        Blockly.Xml.domToWorkspace(xml, workspace);
      } catch (e) {
        console.error('loadXml failed', e);
      }
    }

    function getCode() {
      try {
        return Blockly.JavaScript.workspaceToCode(workspace);
      } catch (e) {
        return '';
      }
    }

    function getXml() {
      try {
        const xml = Blockly.Xml.workspaceToDom(workspace);
        return Blockly.Xml.domToText(xml);
      } catch (e) {
        return '<xml/>';
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      initWorkspace();
      postToHost('ready', {});
    });
  </script>
</body>
</html>
